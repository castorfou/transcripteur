[package]
name = "spike"
version = "0.0.0"
edition = "2024"
publish = false

[features]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }
whisper-rs = "0.16"
cpal = "0.18"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
